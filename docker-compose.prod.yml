services:
  frontend:
    build:
      context: ./nextjs-app
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: bankingai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
      - NODE_ENV=production
    restart: always
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankingai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - REDIS_URL=redis://redis:6379
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_API_URL=${GROQ_API_URL}
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN}
      - HISTORY_INDEX=${HISTORY_INDEX}
      - HISTORY_NAMESPACE=${HISTORY_NAMESPACE}
      - HISTORY_TOPK_RECENT=${HISTORY_TOPK_RECENT}
      - HISTORY_TOPK_RELEVANT=${HISTORY_TOPK_RELEVANT}
      - HISTORY_DISTANCE_THRESHOLD=${HISTORY_DISTANCE_THRESHOLD}
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB=${MONGODB_DB:-banking_ai}
      - JWT_SECRET=${JWT_SECRET:-bankingai-super-secret-key-12345}
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis/redis-stack:latest
    container_name: bankingai-redis
    ports:
      - "6380:6379"
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:latest
    container_name: bankingai-mongodb
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongodb_data:
  redis_data:

networks:
  default:
    name: bankingai-net
